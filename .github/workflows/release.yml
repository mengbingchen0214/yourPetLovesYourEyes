name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pnpm install && break || sleep 10
          done

      - name: Build macOS app
        run: |
          for i in 1 2 3; do
            pnpm run build:mac && break || sleep 10
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm globally
        run: npm install -g pnpm@9
        shell: bash

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pnpm install && break || sleep 10
          done
        shell: bash

      - name: Build Windows app
        run: |
          for i in 1 2 3; do
            pnpm run build:win && break || sleep 10
          done
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm globally
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            pnpm install && break || sleep 10
          done

      - name: Build Linux app
        run: |
          for i in 1 2 3; do
            pnpm run build:linux && break || sleep 10
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml
          retention-days: 7

  release:
    name: Create Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download Mac builds
        uses: actions/download-artifact@v4
        with:
          name: mac-builds
          path: release/

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: release/

      - name: Download Linux builds
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: release/

      - name: List files
        run: ls -lh release/ || echo "No release files found"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
